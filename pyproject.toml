[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiosplus"
version = "0.1.0"
description = "Asynchronous, modular, and typed Python framework for Soroush Plus Bot API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Amin Madani", email = "aminmadani112@gmail.com" }
]
keywords = ["soroush", "soroushplus", "bot", "asyncio", "aiosplus", "telegram-api", "pydantic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "mypy>=1.9.0",
    "ruff>=0.3.0",
]
fastapi = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
]
redis = [
    "redis>=5.0.0",
]
all = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/aminmadaniofficial/aiosplus"
Repository = "https://github.com/aminmadaniofficial/aiosplus.git"
Issues = "https://github.com/aminmadaniofficial/aiosplus/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["aiosplus*"]

[tool.setuptools.package-data]
aiosplus = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=aiosplus --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["aiosplus"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["aiofiles.*", "redis.*"]
ignore_missing_imports = true
